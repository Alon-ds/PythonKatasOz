<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Python Katas Map</title>
  <link rel="preload" href="assets/pixelify-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <header class="hud">
    <h1 id="title">Python Katas</h1>
    <p id="stats" aria-live="polite">Loading the map…</p>
  </header>

  <form class="find" id="find">
    <label for="find-input">Find your soldier</label>
    <div class="find-row">
      <input id="find-input" type="text" placeholder="GitHub username" autocomplete="off" spellcheck="false">
      <button type="submit">Go</button>
    </div>
  </form>

  <p class="banner" id="banner" hidden></p>

  <svg id="map" role="img" aria-label="Map of worlds and students"></svg>
  <div class="tip" id="tip" role="tooltip" hidden></div>

  <script type="module" src="map.js"></script>
</body>
</html>
